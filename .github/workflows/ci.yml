name: CI
on:
  push:
    branches: [main, "wave/**", "lane/**"]
    tags: ["v*"]
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"   # D1: .NET 10 LTS once the SDK is installed on the owner machine
      - run: dotnet restore Oom.sln
      - run: dotnet build Oom.sln --no-restore -c Release
      - run: dotnet test Oom.sln --no-build -c Release
      # The product ships as one self-contained win-x64 executable; a solution that builds
      # and tests but cannot publish is not a releasable candidate (Astra, dalga 1 / INT-1).
      - run: dotnet publish src/Oom/Oom.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - run: if (-not (Test-Path publish/oom.exe)) { throw "publish produced no oom.exe" }
        shell: pwsh
