name: CI
on:
  push:
    branches: [main, "sade/**"]
    tags: ["v*"]
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"
      - run: dotnet restore Oom.sln
      - run: dotnet build Oom.sln --no-restore -c Release
      - run: dotnet test Oom.sln --no-build -c Release
